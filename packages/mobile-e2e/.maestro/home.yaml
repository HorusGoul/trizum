# APP_ID defaults to the store app id; pass -e APP_ID=<id> for a renamed build.
appId: ${APP_ID || "app.trizum.capacitor"}
name: A fresh install shows the empty-state actions
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Split expenses, stay even."
    timeout: 20000
- assertVisible: "Create a Party"
- assertVisible: "Join with a code"
