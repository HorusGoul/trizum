<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      __FONT_CSS__ :root {
        color-scheme: dark;
        font-family: var(--font-sans, system-ui);
        color: var(--foreground);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        color: var(--muted-foreground);
        font-size: 12px;
        margin-bottom: 10px;
      }
      .right {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button,
      select {
        font: inherit;
        background: var(--secondary);
        color: inherit;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
      }
      .stage {
        overflow: hidden;
        border-radius: 12px;
        aspect-ratio: 1646/661;
        background: #061b30;
      }
      .stage svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }
      .controls input {
        min-width: 50px;
        flex: 1;
        accent-color: var(--primary);
      }
      .clock {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--muted-foreground);
      }
      .controls button {
        min-width: 68px;
      }
    </style>
  </head>
  <body>
    <div id="people-and-receipts">
      <div class="meta">
        <span>People & receipts · 20 seconds · 60 fps</span>
        <div class="right">
          <select id="language" aria-label="Animation language">
            <option value="en">English</option>
            <option value="es">Español</option></select
          ><select id="framing" aria-label="Preview framing">
            <option value="safe">Enlarged safe area</option>
            <option value="full">Full header canvas</option>
          </select>
        </div>
      </div>
      <div
        class="stage"
        id="stage"
        role="img"
        aria-label="Three friends add receipts to a stack, combine expenses, and repay each other until all balances are zero"
      ></div>
      <div class="controls">
        <button id="play" type="button">Play</button
        ><input
          id="time"
          type="range"
          min="0"
          max="20"
          step=".01"
          value="8.6"
          aria-label="Animation time"
        /><output id="clock" class="clock">8.6 / 20 s</output>
      </div>
    </div>
    <script>
      __DRAWING_SCRIPT__;
    </script>
  </body>
</html>
