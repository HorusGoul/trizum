name: PWA Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Build PWA
        run: vp run --filter @trizum/pwa build
        env:
          VITE_APP_AUTH_URL: ""

      - name: Deploy PWA preview with Alchemy
        id: deploy
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          vp run pwa:preview --stage "$PREVIEW_ALIAS" --no-input 2>&1 | tee "$RUNNER_TEMP/alchemy-preview.log"
          preview_url="$(grep -Eo "https://${PREVIEW_ALIAS}-trizum\.[a-z0-9-]+\.workers\.dev" "$RUNNER_TEMP/alchemy-preview.log" | head -n 1)"
          test -n "$preview_url"
          echo "deployment-url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          preview_url="${DEPLOYMENT_URL:-}"

          if [ -z "$preview_url" ]; then
            echo "::error::Cloudflare deployment did not return a ${PREVIEW_ALIAS} aliased preview URL."
            exit 1
          fi

          marker="<!-- trizum-pwa-preview -->"
          body="${marker}"$'\n'"PWA preview (${PREVIEW_ALIAS}): ${preview_url}"

          comment_id="$(
            gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate |
              jq -r '.[] | select(.user.type == "Bot" and (.body | contains("<!-- trizum-pwa-preview -->"))) | .id' |
              tail -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
