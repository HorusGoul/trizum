name: PWA Production Migrations
run-name: Apply PWA D1 migrations from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch, tag, or SHA containing the migrations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pwa-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply PWA D1 Migrations
    runs-on: ubuntu-latest
    environment: pwa-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Apply PWA D1 migrations
        working-directory: packages/pwa
        run: vp exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
