name: PWA Production Migrations
run-name: Apply PWA D1 migrations from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch, tag, or SHA containing the migrations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pwa-production
  cancel-in-progress: false
  queue: max

jobs:
  migrate:
    name: Apply PWA D1 Migrations
    runs-on: ubuntu-latest
    environment: pwa-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Build PWA deployment bundle
        run: vp run --filter @trizum/pwa build

      - name: Apply PWA D1 migrations with Alchemy
        working-directory: packages/infra
        run: vp run pwa:deploy --include Database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
