name: Design System Visual Regression

on:
  pull_request:
    paths:
      - "packages/ui/**"
      - "packages/pwa/src/**"
      - "packages/pwa/e2e/visual/**"
      - "packages/pwa/e2e/harness/**"
      - "packages/pwa/playwright*.ts"
      - "packages/pwa/tsconfig.visual.json"
      - "packages/pwa/vite.config.ts"
      - "packages/pwa/package.json"
      - "packages/icon-sprite/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual parity with main
    runs-on: ubuntu-24.04
    container:
      # Keep aligned with the Playwright catalog and the functional E2E job.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: main
          path: .visual-reference
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      - name: Verify Playwright image version
        working-directory: packages/pwa
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const { version } = require('@playwright/test/package.json');
          const { driverVersion } = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(driverVersion, version, 'Update the CI Playwright image and pnpm catalog together');
          console.log(`Playwright package and image match: ${version}`);
          NODE

      - name: Build reference from main
        id: reference
        working-directory: .visual-reference
        run: |
          vp install --frozen-lockfile
          VITE_E2E_HARNESS=true VITE_APP_DISABLE_SENTRY=true vp run --filter @trizum/pwa build
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compare reference and candidate
        run: vp run --filter @trizum/pwa test:visual
        env:
          PLAYWRIGHT_REFERENCE_URL: http://127.0.0.1:4174
          PLAYWRIGHT_REFERENCE_DIR: ${{ github.workspace }}/.visual-reference
          VISUAL_REFERENCE_SHA: ${{ steps.reference.outputs.sha }}
          VISUAL_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload visual comparison report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-comparison
          path: |
            packages/pwa/visual-report
            packages/pwa/visual-results
          retention-days: 7
          if-no-files-found: error
